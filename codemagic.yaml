workflows:
  ios-simulator-build:
    name: iOS Simulator Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Install dependencies

      
        script: |
          flutter pub get
      - name: Prepare iOS build environment
        script: |
          find . -name "Podfile.lock" -delete
          flutter precache --ios
      - name: Build iOS simulator package
        script: |
          flutter build ios --debug --simulator --no-codesign
    artifacts:
      - build/ios/iphonesimulator/**/*.app