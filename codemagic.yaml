workflows:
  ios-unsigned-build:
    name: Unsigned iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Install dependencies
        script: |
          flutter pub get
      - name: Build iOS simulator app
        script: |
          flutter build ios --simulator --debug
    artifacts:
      - build/ios/iphonesimulator/**/*.app