name: my_app
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  image_picker: ^1.0.7  # Or latest version
  path_provider: ^2.1.2

  path: ^1.9.0
  audioplayers: ^6.0.0
  video_player: ^2.9.0

  geolocator: ^13.0.1
  http: ^1.2.0

  collection: ^1.17.0
  shared_preferences: ^2.3.0
  flutter_local_ai: ^0.0.6
  cupertino_icons: ^1.0.8
  intl: ^0.18.1
  # google_mobile_ads: ^3.1.0
  provider: ^6.1.5+1

  flutter_map: ^7.0.0
  latlong2: ^0.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  # 1. Add this package to generate the icons
  flutter_launcher_icons: ^0.13.1

  build_runner: ^2.4.8
  hive_generator: ^2.0.1

# 2. Add this configuration block
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: images/AppLogo.jpg"
  min_sdk_android: 21 
  # For modern Android "Adaptive Icons"
  adaptive_icon_background: "#FFFFFF" 
  adaptive_icon_foreground: images/AppLogo.jpg"

flutter:
  uses-material-design: true

